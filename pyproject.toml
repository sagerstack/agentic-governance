[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-governance"
version = "0.14.0"
description = "App-agnostic runtime governance layer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sagar Pratap Singh" }]
dependencies = []

[project.optional-dependencies]
content = [
  "transformers>=4.40",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_governance = ["policy/*.json"]
